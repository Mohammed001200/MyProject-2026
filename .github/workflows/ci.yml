name: CIVORA quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate typed database client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/civora

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: civora_test
          POSTGRES_PASSWORD: civora_test
          POSTGRES_DB: civora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civora_test -d civora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://civora_test:civora_test@127.0.0.1:5432/civora_test
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-used-outside-tests
      BETTER_AUTH_URL: http://127.0.0.1:3000
      CIVORA_INTEGRATION_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate typed database client
        run: pnpm db:generate

      - name: Apply migrations to isolated PostgreSQL
        run: pnpm db:deploy

      - name: Run identity and tenant integration tests
        run: pnpm test:integration
